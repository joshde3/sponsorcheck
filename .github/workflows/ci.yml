name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Fails the build if a key, password or token is committed (no secrets in the repo).
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan every commit, not only the latest
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Docker is preinstalled on GitHub runners, so Testcontainers works here.
      - run: ./gradlew test --console=plain
